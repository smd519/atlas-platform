site_name: Atlas Platform
site_description: Documentation hub for the Atlas Platform modular monorepo
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/mkdocs_gen_pages.py

nav:
  - Home: index.md
  - High-Level Roadmap: HDROADMAP.md
  - Platform Roadmap: roadmap.md   # mirrored from ROADMAP.md at build time
  - Architecture:
      - Platform Structure: architecture/platform-structure.md
      - Dependency Rules: architecture/dependency-rules.md
      - Module Governance: architecture/module-governance.md
      - Phase Outline: architecture/roadmap.md
  - Architecture Decisions:
      - Overview: decisions/README.md
      - ADR Template: decisions/0000-template.md
  - Platform Modules:   # mirrored from modules/*/README.md at build time
      - Core: modules/atlas-core.md
      - Storage: modules/atlas-storage.md
      - Connectors: modules/atlas-connectors.md
      - Ingestion: modules/atlas-ingestion.md
      - Processing: modules/atlas-processing.md
      - Quality: modules/atlas-quality.md
      - Metadata: modules/atlas-metadata.md
      - Orchestration: modules/atlas-orchestration.md
      - Spatial: modules/atlas-spatial.md
  - Developer Onboarding:
      - Getting Started: onboarding/README.md

