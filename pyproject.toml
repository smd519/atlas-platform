
[project]
name = "atlas-platform"
version = "0.1.0"
description = "Reusable platform for data ingestion, processing, governance, and exploration."
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "delta-spark>=4.1.0",
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "pandas>=3.1.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyspark>=4.3.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.6",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "modules/*",
    "services/*",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "mypy>=1.15",
]

[tool.pytest.ini_options]
testpaths = [
    "modules",
    "services",
    "tests",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
