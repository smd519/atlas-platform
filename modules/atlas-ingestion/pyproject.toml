[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "atlas-ingestion"
version = "0.1.0"
description = "Data extraction, raw layer loading, and ingestion lifecycle management for Atlas Platform."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "atlas-core",
    "atlas-connectors",
    "atlas-storage",
    "pydantic>=2.14.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_ingestion"]
