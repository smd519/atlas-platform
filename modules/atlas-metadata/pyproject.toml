[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "atlas-metadata"
version = "0.1.0"
description = "Dataset catalog, schema registry, and metadata domain foundation for Atlas Platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "atlas-core",
    "pydantic>=2.14.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_metadata"]
